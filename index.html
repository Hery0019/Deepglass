<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deepglass</title>
    <meta name="description" content="A turn-based ASCII roguelike for the browser." />
    <meta name="theme-color" content="#0b0b0f" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #ccc;
        font-family: "DejaVu Sans Mono", "Menlo", "Consolas", monospace;
      }
      html,
      body {
        /* The canvas is sized to the window; the game scrolls its own view instead of the page. */
        overflow: hidden;
        height: 100%;
      }
      #game {
        display: block;
        margin: 0 auto;
        image-rendering: pixelated;
        /* Taps act at once: no double-tap zoom delay. Pinch zoom still works. */
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
